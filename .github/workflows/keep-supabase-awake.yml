# Free Supabase projects pause after about a week without activity, which stops
# the hub from saving. This reads one row every 3 days to keep the project awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read from the hub database
        run: |
          curl -fsS --retry 3 \
            "https://aimydzuynnzumnaehiqi.supabase.co/rest/v1/hub_docs?select=id&limit=1" \
            -H "apikey: sb_publishable_dukb24tfoznTtdsoDc8x_w_roDfMAHM"
